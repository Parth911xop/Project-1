<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Schedules | Smart Shipping</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <script src="nav.js"></script>
</head>

<body class="home-page">

    <!-- Header -->
    <header class="hero-section d-flex align-items-center position-relative" style="min-height: 60vh;">
        <div class="container position-relative z-2">
            <h1 class="display-3 fw-bold mb-4">Vessel Schedules</h1>
            <p class="lead text-white-50 mb-5" style="max-width: 600px;">Find schedules for Point-to-Point, Port Calls,
                and Vessel routes.</p>

            <div class="card-enterprise p-4" style="max-width: 800px;">
                <h5 class="mb-4">Search Schedules</h5>
                <form class="row g-3" id="schedules-form">
                    <div class="col-md-5">
                        <label class="form-label text-muted small">Origin</label>
                        <div class="input-group">
                            <span class="input-group-text bg-transparent text-white-50 border-end-0"><i
                                    class="fas fa-map-marker-alt"></i></span>
                            <input type="text" class="form-control bg-transparent text-white border-start-0"
                                placeholder="City or Port" id="origin-input" list="ports" required>
                        </div>
                    </div>
                    <div class="col-md-5">
                        <label class="form-label text-muted small">Destination</label>
                        <div class="input-group">
                            <span class="input-group-text bg-transparent text-white-50 border-end-0"><i
                                    class="fas fa-map-marker-alt"></i></span>
                            <input type="text" class="form-control bg-transparent text-white border-start-0"
                                placeholder="City or Port" id="destination-input" list="ports" required>
                        </div>
                    </div>
                    <div class="col-md-2 d-flex align-items-end">
                        <button type="submit" class="btn btn-primary w-100" id="search-btn">Search</button>
                    </div>

                    <!-- Autosuggest Data -->
                    <datalist id="ports">
                        <option value="Singapore (SG SIN)">
                        <option value="Los Angeles (US LAX)">
                        <option value="Mumbai (IN BOM)">
                        <option value="Le Havre (FR LEH)">
                        <option value="Shanghai (CN PVG)">
                        <option value="Rotterdam (NL RTM)">
                        <option value="Dubai (AE DXB)">
                        <option value="New York (US NYC)">
                        <option value="Hamburg (DE HAM)">
                        <option value="Tokyo (JP TYO)">
                    </datalist>
                </form>
                <div id="schedule-results" class="mt-4 d-none">
                    <h6 class="text-muted fw-bold mb-3">Available Schedules</h6>
                    <div class="list-group">
                        <!-- Results injected here -->
                    </div>
                </div>
            </div>
        </div>
    </header>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="schedules.js"></script>
</body>

</html>
