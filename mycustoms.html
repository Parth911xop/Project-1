<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>MyCustoms | Smart Shipping</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <script src="config.js"></script>
    <script src="auth-guard.js"></script>
</head>

<body class="home-page">

    <!-- Header -->
    <header class="hero-section d-flex align-items-center position-relative" style="min-height: 40vh;">
        <div class="container position-relative z-2">
            <div class="d-flex justify-content-between align-items-end mb-4">
                <div>
                    <h1 class="display-3 fw-bold mb-2">MyCustoms</h1>
                    <p class="lead text-white-50" style="max-width: 600px;">Manage your customs declarations and
                        compliance documents.</p>
                </div>
                <button class="btn btn-primary rounded-pill px-4 shadow-lg" onclick="createQuickDeclaration()">
                    <i class="fas fa-plus me-2"></i>New Declaration
                </button>
            </div>

            <div class="row g-4 mb-5">
                <div class="col-md-4">
                    <div class="card-enterprise p-4 h-100">
                        <h5 class="fw-bold"><i class="fas fa-file-invoice me-2 text-info"></i>Active Declarations</h5>
                        <h2 class="display-4 fw-bold mt-2" id="stat-active">0</h2>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="card-enterprise p-4 h-100">
                        <h5 class="fw-bold"><i class="fas fa-exclamation-circle me-2 text-warning"></i>Pending Actions
                        </h5>
                        <h2 class="display-4 fw-bold mt-2" id="stat-pending">0</h2>
                    </div>
                </div>
            </div>

            <!-- Declarations List -->
            <h4 class="fw-bold text-white mb-3">Recent Filings</h4>
            <div id="declarations-container" class="pb-5">
                <div class="text-center py-5">
                    <div class="spinner-border text-primary" role="status"></div>
                </div>
            </div>

        </div>
    </header>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="customs.js"></script>
</body>

</html>
