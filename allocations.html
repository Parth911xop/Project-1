<!DOCTYPE html>
<html lang="en">

<head>
    <script src="config.js"></script>
    <meta charset="UTF-8">
    <title>Allocations | Smart Shipping</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <script src="nav.js"></script>
</head>

<body class="home-page">

    <!-- Header -->
    <header class="hero-section d-flex align-items-center position-relative" style="min-height: 60vh;">
        <div class="container position-relative z-2">
            <h1 class="display-3 fw-bold mb-4">Allocations</h1>
            <p class="lead text-white-50 mb-5" style="max-width: 600px;">Review and manage your agreed cargo volume
                allocations.</p>

            <div class="card-enterprise p-5 text-center">
                <i class="fas fa-chart-pie fa-3x text-primary mb-3"></i>
                <h3>Your Allocation Status</h3>
                <p class="text-muted">You have used <strong>45%</strong> of your monthly allocation.</p>
                <div class="progress bg-secondary" style="height: 20px;">
                    <div class="progress-bar bg-primary" role="progressbar" style="width: 45%;" aria-valuenow="45"
                        aria-valuemin="0" aria-valuemax="100">45%</div>
                </div>
            </div>

        </div>
    </header>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>

</html>
