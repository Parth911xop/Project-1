<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Live Tracking | Smart Shipping</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="dist/leaflet.css">
    <link rel="stylesheet" href="dashboard.css">
    <style>
        #map { height: 450px; width: 100%; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); }
        .ship-marker-wrapper { position: relative; width: 40px; height: 40px; transform-origin: center; transition: all 0.3s ease; }
        .ship-icon-body { font-size: 24px; color: #22c55e; display: flex; justify-content: center; align-items: center; }
        .ship-glow { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 30px; height: 30px; background: rgba(34, 197, 94, 0.3); border-radius: 50%; filter: blur(5px); animation: pulse 2s infinite; z-index: -1; }
        @keyframes pulse { 0% { transform: translate(-50%, -50%) scale(0.8); opacity: 0.8; } 100% { transform: translate(-50%, -50%) scale(1.5); opacity: 0; } }
        .port-icon { display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,0.5); border-radius: 50%; width: 30px; height: 30px; border: 1px solid rgba(255,255,255,0.3); }
        .event-pill { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); padding: 12px 16px; border-radius: 12px; margin-bottom: 8px; font-size: 13px; }
        .tracking-popup { background: #1a1a1a; color: white; padding: 12px; border-radius: 8px; border: 1px solid #333; min-width: 160px; }
        .popup-header { font-size: 10px; color: #888; text-transform: uppercase; margin-bottom: 4px; }
        .popup-id { font-weight: bold; font-size: 15px; margin-bottom: 8px; }
        .popup-status { color: #22c55e; font-size: 13px; font-weight: 600; padding: 4px 0; border-top: 1px solid #333; margin-top: 4px; }
        .popup-coords { font-size: 10px; color: #666; font-family: monospace; }
        .leaflet-popup-content-wrapper { background: #1a1a1a !important; color: white !important; border: 1px solid #333; }
        .leaflet-popup-tip { background: #1a1a1a !important; border: 1px solid #333; }
    </style>
</head>

<body class="dashboard-page overflow-hidden">
    <aside class="sidebar">
        <div class="brand-section">
            <a href="index.html" class="text-decoration-none">
                <h4 class="fw-bold text-white mb-0"><i class="fas fa-ship me-2 text-primary"></i>SmartShip</h4>
            </a>
            <span class="text-xs text-white-50">ENTERPRISE</span>
        </div>
        <nav class="d-flex flex-column gap-1">
            <a href="shipments.html" class="nav-item-dash "><i class="fas fa-th-large w-5"></i> Dashboard</a>
            <a href="wizard.html" class="nav-item-dash"><i class="fas fa-plus-circle w-5"></i> New Booking</a>
            <a href="track.html" class="nav-item-dash active"><i class="fas fa-map-marked-alt w-5"></i> Live Tracking</a>
            <a href="documents.html" class="nav-item-dash "><i class="fas fa-folder-open w-5"></i> Documents</a>
            <a href="schedules.html" class="nav-item-dash "><i class="fas fa-calendar-alt w-5"></i> Schedules</a>
            <hr class="border-secondary opacity-25 my-3">
            <a href="finance.html" class="nav-item-dash "><i class="fas fa-file-invoice-dollar w-5"></i> Billing</a>
            <a href="support.html" class="nav-item-dash "><i class="fas fa-headset w-5"></i> Support</a>
            <a href="settings.html" class="nav-item-dash "><i class="fas fa-cog w-5"></i> Settings</a>
        </nav>
        <div class="mt-auto pt-4 border-top border-secondary border-opacity-10">
            <div class="d-flex align-items-center gap-2">
                <div id="user-avatar" class="bg-primary rounded-circle d-flex align-items-center justify-content-center text-white fw-bold" style="width:32px;height:32px;">U</div>
                <div class="d-grid">
                    <span id="user-name-display" class="text-white text-sm fw-bold">User</span>
                </div>
            </div>
        </div>
    </aside>

    <main class="dashboard-main h-100">
        <div class="p-4">
            <div class="mb-4 d-flex justify-content-between align-items-center">
                <div>
                    <h3 class="fw-bold text-white">Live Tracking</h3>
                    <p class="text-white-50 small">Monitor your global shipments with sub-meter precision.</p>
                </div>
                <div id="live-badge" class="badge bg-success bg-opacity-10 text-success border border-success d-none py-2 px-3 rounded-pill">
                    <span class="live-dot me-2"></span> Satellite Active
                </div>
            </div>

            <div class="row g-4">
                <div class="col-lg-3">
                    <div class="summary-card p-3 h-100">
                        <div class="mb-4">
                            <h6 class="text-white-50 text-uppercase small fw-bold mb-3">Quick Search</h6>
                            <div class="input-group input-group-sm mb-3">
                                <input type="text" id="shipment-search-input" class="form-control bg-dark text-white border-secondary" placeholder="Ref: SS-1025">
                                <button class="btn btn-primary" onclick="searchByShipmentId()"><i class="fas fa-search"></i></button>
                            </div>
                        </div>
                        <h6 class="text-white-50 text-uppercase small fw-bold mb-3">Your Fleet</h6>
                        <div id="shipment-list" class="d-flex flex-column gap-2" style="max-height: 50vh; overflow-y: auto;">
                            <div class="text-center py-4"><div class="spinner-border spinner-border-sm text-primary"></div></div>
                        </div>
                    </div>
                </div>

                <div class="col-lg-9">
                    <div class="summary-card p-3 mb-3 position-relative">
                        <h6 class="text-white fw-bold mb-3" id="tracking-title">Select a shipment to begin</h6>
                        <div id="map"></div>
                    </div>

                    <div class="summary-card p-3">
                        <h6 class="text-white-50 text-uppercase small fw-bold mb-3"><i class="fas fa-satellite-dish me-2 text-primary"></i>Event Feed</h6>
                        <div id="event-feed" class="d-flex flex-column gap-2" style="max-height: 180px; overflow-y: auto;">
                            <p class="text-white-50 small">Connection standby...</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="dist/leaflet.js"></script>
    <script src="https://cdn.socket.io/4.7.4/socket.io.min.js"></script>
    <script>
        const API_URL = `http://${window.location.hostname}:3000`;
        let map, marker, polyline, socket, activeShipmentId;
        let trackingPath = [];
        let portMarkers = [];
        let voyagePlannedPath = null;

        function initMap(lat = 20.5937, lng = 78.9629) {
            if (map) return;
            L.Icon.Default.imagePath = 'dist/images/';
            map = L.map('map').setView([lat, lng], 3);
            L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
                attribution: '© CARTO',
                maxZoom: 18
            }).addTo(map);

            polyline = L.polyline([], { color: '#6366f1', weight: 4, opacity: 0.8, dashArray: '8, 12' }).addTo(map);
        }

        function updateMapPin(lat, lng, label = 'Shipment', status = '', heading = 0) {
            if (!map) initMap(lat, lng);
            const pos = [parseFloat(lat), parseFloat(lng)];
            
            if (trackingPath.length === 0 || 
                trackingPath[trackingPath.length-1][0] !== pos[0] || 
                trackingPath[trackingPath.length-1][1] !== pos[1]) {
                trackingPath.push(pos);
                polyline.setLatLngs(trackingPath);
            }

            if (marker) map.removeLayer(marker);
            
            const customIcon = L.divIcon({
                className: 'custom-ship-icon',
                html: `<div class="ship-marker-wrapper" style="transform: rotate(${heading}deg);">
                        <div class="ship-icon-body"><i class="fas fa-location-arrow"></i></div>
                        <div class="ship-glow"></div>
                    </div>`,
                iconSize: [40, 40],
                iconAnchor: [20, 20],
                popupAnchor: [0, -15]
            });

            marker = L.marker(pos, { icon: customIcon, zIndexOffset: 1000 }).addTo(map);
            marker.bindPopup(`
                <div class="tracking-popup">
                    <div class="popup-header">LIVE SATELLITE UPDATE</div>
                    <div class="popup-id">${label}</div>
                    <div class="popup-status active">${status || 'In Transit'}</div>
                    <div class="popup-coords">${lat.toFixed(4)}, ${lng.toFixed(4)}</div>
                </div>
            `, { closeButton: false, offset: [0, -5] }).openPopup();

            map.panTo(pos, { animate: true, duration: 1.5 });
        }

        function addEvent(data) {
            const feed = document.getElementById('event-feed');
            if (feed.querySelector('p')) feed.innerHTML = '';
            const pill = document.createElement('div');
            pill.className = 'event-pill d-flex justify-content-between align-items-center animate-fade-in';
            pill.innerHTML = `
                <div>
                    <i class="fas fa-dot-circle text-primary me-2 x-small"></i>
                    <strong class="text-white">${data.status || 'Signal'}</strong>
                    <span class="text-white-50 ms-2">${data.message || ''}</span>
                </div>
                <span class="text-white-50 x-small">${new Date(data.timestamp || Date.now()).toLocaleTimeString()}</span>
            `;
            feed.prepend(pill);
        }

        function searchByShipmentId() {
            const inputVal = document.getElementById('shipment-search-input').value.trim();
            if(!inputVal) return;
            const numericId = inputVal.includes('-') ? inputVal.split('-').pop() : inputVal;
            joinShipment(numericId, 'ID');
        }

        async function joinShipment(shipmentId, prefix = 'SS') {
            activeShipmentId = shipmentId;
            trackingPath = [];
            if(polyline) polyline.setLatLngs([]);
            if(marker) map.removeLayer(marker);
            marker = null;
            portMarkers.forEach(m => map.removeLayer(m));
            portMarkers = [];
            if(voyagePlannedPath) map.removeLayer(voyagePlannedPath);

            document.getElementById('tracking-title').innerText = `Tracking System: #${prefix}-${shipmentId}`;
            document.getElementById('live-badge').classList.remove('d-none');
            
            if (!map) initMap();
            
            try {
                const res = await fetch(`${API_URL}/api/shipment/${shipmentId}/tracking`, { credentials: 'include' });
                const data = await res.json();
                if (data.success && data.shipment) {
                    const s = data.shipment;
                    
                    // Plot Partial Segment Journey (Source -> Intermediate Stops -> Drop Port)
                    if (data.tracking && data.tracking.routeStops) {
                        const stops = data.tracking.routeStops;
                        const pathCoords = [];
                        
                        stops.forEach((st, idx) => {
                            if (st.lat && st.lng) {
                                const pos = [parseFloat(st.lat), parseFloat(st.lng)];
                                pathCoords.push(pos);
                                
                                const iconType = idx === 0 ? 'anchor text-warning' : (idx === stops.length - 1 ? 'flag-checkered text-danger' : 'circle text-white-50');
                                const label = idx === 0 ? 'Origin' : (idx === stops.length - 1 ? 'Destination' : `Stop ${st.stop_order}`);
                                
                                const m = L.marker(pos, { 
                                    icon: L.divIcon({ 
                                        html: `<div class="port-icon"><i class="fas fa-${iconType} x-small"></i></div>`, 
                                        className:'', 
                                        iconSize:[30,30] 
                                    })
                                }).addTo(map).bindPopup(`<b>${label}:</b><br>${st.port_name}`);
                                portMarkers.push(m);
                            }
                        });

                        if (pathCoords.length >= 2) {
                            voyagePlannedPath = L.polyline(pathCoords, {
                                color: '#ffffff', weight: 1, dashArray: '10, 15', opacity: 0.3
                            }).addTo(map);
                            map.fitBounds(voyagePlannedPath.getBounds(), { padding: [80, 80] });
                        }
                    }

                    if (data.tracking?.livePosition) {
                        const lp = data.tracking.livePosition;
                        updateMapPin(lp.lat, lp.lng, `#${prefix}-${shipmentId}`, data.tracking.status);
                    }
                }
            } catch (err) { console.error(err); }
        }

        document.addEventListener('DOMContentLoaded', async () => {
            try {
                const res = await fetch(`${API_URL}/api/auth/me`, { credentials: 'include' });
                const auth = await res.json();
                if (!auth.success) { window.location.href = 'auth.html'; return; }
                document.getElementById('user-name-display').innerText = auth.user.name;
                document.getElementById('user-avatar').innerText = auth.user.name[0].toUpperCase();

                const shipRes = await fetch(`${API_URL}/api/shipment/list`, { credentials: 'include' });
                const shipData = await shipRes.json();
                const listEl = document.getElementById('shipment-list');
                
                if (shipData.success && shipData.shipments?.length) {
                    listEl.innerHTML = shipData.shipments.map(s => `
                        <button class="shipment-btn btn btn-dark btn-sm text-start border border-secondary border-opacity-25 rounded-3 p-3 w-100 mb-2"
                                onclick="joinShipment(${s.id}, '${s.user_prefix || 'SS'}')">
                            <div class="fw-bold text-white mb-1">#${s.user_prefix || 'SS'}-${s.id}</div>
                            <div class="text-white-50 x-small text-truncate">${s.origin_address} ➔ ${s.destination_address}</div>
                        </button>
                    `).join('');
                } else {
                    listEl.innerHTML = '<p class="text-white-50 x-small text-center py-3">No active shipments</p>';
                }

                const urlParams = new URLSearchParams(window.location.search);
                const queryId = urlParams.get('id');
                if (queryId) {
                    document.getElementById('shipment-search-input').value = queryId;
                    joinShipment(queryId, 'ID');
                }
            } catch (err) { window.location.href = 'auth.html'; }
        });

        function handleLogout() {
            fetch(`${API_URL}/api/auth/logout`, { method: 'POST', credentials: 'include' })
                .then(() => window.location.href = 'auth.html');
        }
    </script>
</body>
</html>
