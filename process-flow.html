<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Process Flow | Smart Shipping</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="style.css"> <!-- Use Universal Enterprise Style -->
    <link rel="stylesheet" href="process-flow.css">
    <style>
        .step-item {
            cursor: pointer;
            padding: 1rem;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.05);
            /* Glassy Step */
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-muted);
            transition: all 0.3s ease;
            text-align: center;
            flex: 1;
            margin: 0 5px;
        }

        .step-item.active {
            background: var(--primary);
            color: white;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4);
            transform: translateY(-2px);
        }

        .step-item.done {
            background: var(--success);
            color: white;
            border-color: var(--success);
        }

        .step-number {
            font-size: 1.2rem;
            font-weight: 800;
            margin-bottom: 0.5rem;
        }

        .step-label {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
        }
    </style>
</head>

<body class="bg-dark text-white">

    <div class="container py-5 mt-5">
        <header class="text-center mb-5">
            <h1 class="fw-bold display-5 text-white">Journey Manager</h1>
            <p class="text-white-50">Complete the steps below to move your shipment.</p>
            <span id="shipment-id-display"
                class="badge bg-primary fs-6 px-3 py-2 rounded-pill shadow-sm">Loading...</span>
        </header>

        <!-- Use New Container Class -->
        <div class="process-stepper" id="stepper-nav">
            <!-- Steppers injected here -->
        </div>

        <div class="card glass shadow-lg border-0 rounded-4" style="max-width: 900px; margin: 0 auto;">
            <div id="step-content" class="p-5 text-white">
                <!-- FORM CONTENT -->
            </div>

            <div
                class="card-footer bg-transparent border-top border-white border-opacity-10 p-4 d-flex justify-content-between align-items-center">
                <button id="back-btn" class="btn btn-outline-light px-4 rounded-pill" onclick="goBack()">
                    <i class="fas fa-chevron-left me-2"></i> Back
                </button>

                <div class="d-flex gap-2">
                    <button class="btn btn-dark btn-sm rounded-pill px-3" onclick="toggleReview()">
                        <i class="fas fa-history me-1"></i> Review Data
                    </button>
                    <button class="btn btn-danger btn-sm rounded-pill px-3" onclick="resetProcess()">
                        <i class="fas fa-redo me-1"></i> Reset
                    </button>
                </div>

                <button id="next-btn" class="btn btn-primary px-5 rounded-pill shadow-lg" onclick="validateAndNext()">
                    <span id="next-btn-text">Next Step</span> <i class="fas fa-chevron-right ms-2"></i>
                </button>
            </div>
        </div>

        <div id="review-panel" class="mt-4 card card-enterprise p-4 d-none text-white"
            style="max-width: 900px; margin: 0 auto;">
            <h5 class="fw-bold text-white-50 mb-3"><i class="fas fa-database me-2"></i>Session Data</h5>
            <div id="review-data-table" class="small"></div>
        </div>
    </div>

    <!-- Toast Container -->
    <div class="position-fixed bottom-0 end-0 p-3" id="toast-container" style="z-index: 9999"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="process-flow.js"></script>
</body>

</html>
