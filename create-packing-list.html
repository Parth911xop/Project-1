<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Create Packing List | Smart Shipping</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <script src="auth-guard.js"></script>
    <style>
        .item-row {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            position: relative;
        }

        .remove-item-btn {
            position: absolute;
            top: 10px;
            right: 10px;
        }
    </style>
</head>

<body class="home-page">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark fixed-top glass-nav">
        <div class="container-fluid px-4">
            <a class="navbar-brand fw-bold" href="index.html">
                <i class="fas fa-ship me-2 text-primary"></i>Smart Shipping
            </a>
            <div class="ms-auto d-flex align-items-center gap-3">
                <a href="shipments.html" class="btn btn-outline-light btn-sm rounded-pill">Back to Hub</a>
            </div>
        </div>
    </nav>

    <div class="container py-5 mt-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h2 class="fw-bold text-white">Create Packing List</h2>
                <p class="text-white-50">Specify the detailed cargo items for Shipment <span id="shipment-id-badge"
                        class="badge bg-primary"></span></p>
            </div>
            <div>
                <button class="btn btn-outline-light rounded-pill me-2" onclick="loadSavedPackingList()"><i
                        class="fas fa-sync-alt me-2"></i>Reload</button>
                <a id="view-pdf-btn" href="#" target="_blank" class="btn btn-success rounded-pill d-none"><i
                        class="fas fa-file-pdf me-2"></i>View PDF</a>
            </div>
        </div>

        <form id="packingListForm">
            <!-- Parties Info -->
            <div class="card-enterprise p-4 mb-4 border border-secondary border-opacity-25">
                <h5 class="fw-bold mb-4 text-white"><i class="fas fa-users text-primary me-2"></i>Parties Information
                </h5>
                <div class="row g-4">
                    <div class="col-md-6">
                        <label class="form-label text-white-50 small text-uppercase fw-bold">Exporter (Shipper)
                            Name</label>
                        <input type="text" class="form-control bg-dark text-white border-secondary" id="exporterName"
                            required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label text-white-50 small text-uppercase fw-bold">Consignee (Buyer)
                            Name</label>
                        <input type="text" class="form-control bg-dark text-white border-secondary" id="consigneeName"
                            required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label text-white-50 small text-uppercase fw-bold">Exporter Address</label>
                        <textarea class="form-control bg-dark text-white border-secondary" id="exporterAddress" rows="3"
                            required></textarea>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label text-white-50 small text-uppercase fw-bold">Consignee Address</label>
                        <textarea class="form-control bg-dark text-white border-secondary" id="consigneeAddress"
                            rows="3" required></textarea>
                    </div>
                </div>
            </div>

            <!-- Packing Items -->
            <div class="card-enterprise p-4 mb-4 border border-secondary border-opacity-25">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h5 class="fw-bold text-white mb-0"><i class="fas fa-box-open text-info me-2"></i>Cargo Items</h5>
                    <button type="button" class="btn btn-outline-info btn-sm rounded-pill" onclick="addPackingItem()">
                        <i class="fas fa-plus me-1"></i> Add Item
                    </button>
                </div>

                <div id="items-container">
                    <!-- Items injected here -->
                </div>
            </div>

            <!-- Submit -->
            <div class="text-end">
                <button type="submit" class="btn btn-primary btn-lg rounded-pill px-5" id="save-btn">
                    Save Packing List <i class="fas fa-save ms-2"></i>
                </button>
            </div>
        </form>
    </div>

    <!-- Script -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const API_URL = `http://${window.location.hostname}:3000`;
        const urlParams = new URLSearchParams(window.location.search);
        const shipmentId = urlParams.get('shipmentId');

        let itemIndex = 0;

        if (!shipmentId) {
            alert("No Shipment ID provided.");
            window.location.href = 'shipments.html';
        }

        document.getElementById('shipment-id-badge').innerText = `#${shipmentId}`;
        document.getElementById('view-pdf-btn').href = `packing-list.html?shipmentId=${shipmentId}`;

        // Initialize first item
        document.addEventListener('DOMContentLoaded', () => {
            loadSavedPackingList();
        });

        function addPackingItem(data = null) {
            const container = document.getElementById('items-container');
            const idx = itemIndex++;

            const div = document.createElement('div');
            div.className = 'item-row animate-fade-in';
            div.id = `item-${idx}`;

            div.innerHTML = `
                ${idx > 0 ? `<button type="button" class="btn btn-sm btn-outline-danger rounded-circle remove-item-btn" onclick="removeItem(${idx})"><i class="fas fa-times"></i></button>` : ''}
                <div class="row g-3">
                    <div class="col-md-4">
                        <label class="form-label text-white-50 small">Description / Product</label>
                        <input type="text" class="form-control bg-dark text-white border-secondary item-desc" required value="${data?.description || ''}">
                    </div>
                    <div class="col-md-2">
                        <label class="form-label text-white-50 small">Package Type</label>
                        <select class="form-select bg-dark text-white border-secondary item-type">
                            <option value="Box" ${data?.package_type === 'Box' ? 'selected' : ''}>Box</option>
                            <option value="Pallet" ${data?.package_type === 'Pallet' ? 'selected' : ''}>Pallet</option>
                            <option value="Carton" ${data?.package_type === 'Carton' ? 'selected' : ''}>Carton</option>
                            <option value="Drum" ${data?.package_type === 'Drum' ? 'selected' : ''}>Drum</option>
                            <option value="Crate" ${data?.package_type === 'Crate' ? 'selected' : ''}>Crate</option>
                        </select>
                    </div>
                    <div class="col-md-1">
                        <label class="form-label text-white-50 small">Qty</label>
                        <input type="number" class="form-control bg-dark text-white border-secondary item-qty" required min="1" value="${data?.quantity || 1}">
                    </div>
                    <div class="col-md-2">
                        <label class="form-label text-white-50 small">Net Wt (kg)</label>
                        <input type="number" step="0.01" class="form-control bg-dark text-white border-secondary item-net" required min="0.1" value="${data?.net_weight || ''}">
                    </div>
                    <div class="col-md-2">
                        <label class="form-label text-white-50 small">Gross Wt (kg)</label>
                        <input type="number" step="0.01" class="form-control bg-dark text-white border-secondary item-gross" required min="0.1" value="${data?.gross_weight || ''}">
                    </div>
                    <div class="col-md-1">
                        <label class="form-label text-white-50 small">Vol (cbm)</label>
                        <input type="number" step="0.01" class="form-control bg-dark text-white border-secondary item-vol" value="${data?.volume_cbm || ''}">
                    </div>
                </div>
            `;
            container.appendChild(div);
        }

        function removeItem(idx) {
            document.getElementById(`item-${idx}`).remove();
        }

        async function loadSavedPackingList() {
            try {
                // Preload basic shipment info just in case
                const shipRes = await fetch(`${API_URL}/api/shipment/${shipmentId}`, { credentials: 'include' });
                const shipData = await shipRes.json();

                if (shipData.success && shipData.shipment) {
                    const s = shipData.shipment;

                    // Fetch real packing list if it exists
                    const packRes = await fetch(`${API_URL}/api/packing-list/${shipmentId}`, { credentials: 'include' });
                    const packData = await packRes.json();

                    if (packData.success && packData.packingList) {
                        // Populate saved data
                        document.getElementById('exporterName').value = packData.packingList.exporter_name || '';
                        document.getElementById('consigneeName').value = packData.packingList.consignee_name || '';
                        document.getElementById('exporterAddress').value = packData.packingList.exporter_address || '';
                        document.getElementById('consigneeAddress').value = packData.packingList.consignee_address || '';

                        document.getElementById('items-container').innerHTML = ''; // Clear
                        itemIndex = 0;

                        packData.items.forEach(it => {
                            addPackingItem(it);
                        });

                        document.getElementById('view-pdf-btn').classList.remove('d-none');
                    } else {
                        // Pre-fill with default shipment info
                        document.getElementById('exporterName').value = s.customer_name || 'Exporter Ltd';
                        document.getElementById('consigneeName').value = 'Consignee Global LLC';
                        document.getElementById('exporterAddress').value = s.origin_address || '';
                        document.getElementById('consigneeAddress').value = s.destination_address || '';

                        document.getElementById('items-container').innerHTML = '';
                        itemIndex = 0;
                        addPackingItem({
                            description: s.product_type || 'General Cargo',
                            package_type: 'Pallet',
                            quantity: 1,
                            net_weight: s.weight * 0.95,
                            gross_weight: s.weight,
                            volume_cbm: s.volume_cbm || 0
                        });
                    }
                }
            } catch (e) {
                console.error(e);
                // Fallback UI
                if (itemIndex === 0) addPackingItem();
            }
        }

        document.getElementById('packingListForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const btn = document.getElementById('save-btn');
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Saving...';

            const payload = {
                exporter_name: document.getElementById('exporterName').value,
                exporter_address: document.getElementById('exporterAddress').value,
                consignee_name: document.getElementById('consigneeName').value,
                consignee_address: document.getElementById('consigneeAddress').value,
                items: []
            };

            document.querySelectorAll('.item-row').forEach(row => {
                payload.items.push({
                    description: row.querySelector('.item-desc').value,
                    package_type: row.querySelector('.item-type').value,
                    quantity: parseInt(row.querySelector('.item-qty').value),
                    net_weight: parseFloat(row.querySelector('.item-net').value),
                    gross_weight: parseFloat(row.querySelector('.item-gross').value),
                    volume_cbm: parseFloat(row.querySelector('.item-vol').value) || 0
                });
            });

            try {
                const res = await fetch(`${API_URL}/api/packing-list/${shipmentId}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify(payload)
                });
                const data = await res.json();
                if (data.success) {
                    alert("Packing list saved successfully!");
                    document.getElementById('view-pdf-btn').classList.remove('d-none');
                } else {
                    alert('Error saving. Please try again.');
                }
            } catch (err) {
                console.error(err);
                alert("Network error.");
            } finally {
                btn.disabled = false;
                btn.innerHTML = 'Save Packing List <i class="fas fa-save ms-2"></i>';
            }
        });
    </script>
</body>

</html>
