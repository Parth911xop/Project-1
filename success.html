<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Successful - Smart Shipping</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body {
            background-color: #0f172a;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        .success-card {
            background-color: #1e293b;
            padding: 40px;
            border-radius: 12px;
            text-align: center;
            max-width: 500px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
        }

        .icon {
            font-size: 60px;
            color: #10b981;
            margin-bottom: 20px;
        }
    </style>
</head>

<body>

    <div class="success-card">
        <i class="bi bi-check-circle-fill icon"></i>
        <h2>Payment Successful!</h2>
        <p class="text-secondary mt-3">Your transaction has been securely processed by Stripe. Your shipment is now
            confirmed and actively being routed to carriers.</p>

        <div class="mt-4">
            <span id="shipment-ref" class="badge bg-primary fs-6 mb-4"></span><br>
            <a href="shipments.html" class="btn btn-light px-4 py-2 fw-semibold">Go to My Shipments</a>
            <button onclick="window.print()" class="btn btn-outline-secondary px-4 py-2 ms-2">Print Receipt</button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            let shipmentId = params.get('shipment_id') || params.get('id');
            if (shipmentId) {
                // If it doesn't already have a dash, we could try to prefix it, 
                // but usually the redirect should provide the display ID or we just show the number.
                // For now, let's just show what we got.
                document.getElementById('shipment-ref').innerText = `Booking Reference: #${shipmentId}`;
            }
        });
    </script>
</body>

</html>
