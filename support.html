<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Support Ticket | Smart Shipping</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="notifications.css">
    <script src="auth-guard.js"></script>
    <script src="nav.js"></script>
</head>

<body class="home-page d-flex flex-column min-vh-100">

    <div class="container flex-grow-1 d-flex justify-content-center align-items-center py-5 mt-5">
        <div class="card-enterprise w-100" style="max-width: 600px;">
            <div class="p-4 border-bottom border-light border-opacity-10 text-center">
                <div class="d-inline-flex justify-content-center align-items-center bg-primary bg-opacity-25 text-primary rounded-circle mb-3"
                    style="width: 64px; height: 64px;">
                    <i class="fas fa-headset fa-2x"></i>
                </div>
                <h3 class="text-white fw-bold">Support Desk</h3>
                <p class="text-white-50 small mb-0">Create a support ticket, and our team will respond within 2 hours.
                </p>
            </div>

            <div class="p-4">
                <form id="supportForm">
                    <div class="mb-3">
                        <label class="form-label text-white-50 small fw-bold text-uppercase">Shipment Reference</label>
                        <div class="input-group">
                            <span class="input-group-text bg-dark border-secondary text-white-50"><i
                                    class="fas fa-hashtag"></i></span>
                            <input type="text" id="shipmentId" class="form-control bg-dark border-secondary text-white"
                                placeholder="e.g. PA-1023">
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label text-white-50 small fw-bold text-uppercase">Issue Type</label>
                        <select id="issueType" class="form-select bg-dark border-secondary text-white" required>
                            <option value="">Select Category...</option>
                            <option value="delay">Shipment Delay / Tracking</option>
                            <option value="customs">Customs Clearance Hold</option>
                            <option value="damage">Damaged / Missing Cargo</option>
                            <option value="billing">Billing & Invoices</option>
                            <option value="other">Other Inquiry</option>
                        </select>
                    </div>

                    <div class="mb-4">
                        <label class="form-label text-white-50 small fw-bold text-uppercase">Description</label>
                        <textarea id="issueDescription" class="form-control bg-dark border-secondary text-white"
                            rows="4" placeholder="Please describe your issue in detail..." required></textarea>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 btn-lg rounded-pill" id="submitBtn">
                        Submit Ticket <i class="fas fa-paper-plane ms-2"></i>
                    </button>
                </form>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-dark text-white-50 py-4 mt-auto border-top border-secondary border-opacity-25">
        <div class="container text-center">
            <small>&copy; 2026 Smart Shipping Ltd. Global Logistics Partner.</small>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="notifications.js"></script>
    <script>
        document.getElementById('supportForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const btn = document.getElementById('submitBtn');
            const originalText = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span> Submitting...';

            const payload = {
                shipmentId: document.getElementById('shipmentId').value,
                issueType: document.getElementById('issueType').value,
                description: document.getElementById('issueDescription').value
            };

            try {
                const API_URL = `http://${location.hostname}:3000`; // Standardize API URL
                const r = await fetch(`${API_URL}/api/support/create`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const d = await r.json();

                if (d.success) {
                    showToast(d.message + `. Reference: ${d.ticketId}`, "success");
                    setTimeout(() => window.location.href = 'shipments.html', 2000);
                } else {
                    showToast(d.message || "Failed to create ticket", "error");
                    btn.disabled = false;
                    btn.innerHTML = originalText;
                }
            } catch (err) {
                showToast("Server error. Please try again later.", "error");
                btn.disabled = false;
                btn.innerHTML = originalText;
            }
        });
    </script>
</body>

</html>
