<!DOCTYPE html>
<html lang="en">

<head>
    <script src="config.js"></script>
    <meta charset="UTF-8">
    <title>Smart Captain™ | Smart Shipping</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <script src="nav.js"></script>
</head>

<body class="home-page">

    <!-- Header -->
    <header class="hero-section d-flex align-items-center position-relative" style="min-height: 60vh;">
        <div class="container position-relative z-2">
            <h1 class="display-3 fw-bold mb-4">Smart Captain™</h1>
            <p class="lead text-white-50 mb-5" style="max-width: 600px;">Direct visibility into your reefer containers.
            </p>

            <div class="row g-4 justify-content-center">
                <div class="col-md-3">
                    <div class="card-enterprise p-3 text-center">
                        <i class="fas fa-temperature-low fa-2x text-info mb-2"></i>
                        <h5>Temperature</h5>
                        <p class="text-success small mb-0">All Optimal</p>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card-enterprise p-3 text-center">
                        <i class="fas fa-wind fa-2x text-white-50 mb-2"></i>
                        <h5>Humidity</h5>
                        <p class="text-success small mb-0">Within Range</p>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card-enterprise p-3 text-center">
                        <i class="fas fa-battery-full fa-2x text-success mb-2"></i>
                        <h5>Power</h5>
                        <p class="text-success small mb-0">Active</p>
                    </div>
                </div>
            </div>

        </div>
    </header>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>

</html>
