<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Analytics | Smart Shipping Enterprise</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="dashboard.css">
</head>

<body class="dashboard-page">

    <!-- SIDEBAR -->
    <aside class="sidebar">
        <div class="brand-section">
            <a href="index.html" class="text-decoration-none">
                <h4 class="fw-bold text-white mb-0"><i class="fas fa-ship me-2 text-primary"></i>SmartShip</h4>
            </a>
            <span class="text-xs text-muted">ENTERPRISE</span>
        </div>

        <nav class="d-flex flex-column gap-1" id="dynamic-nav">
            <!-- Injected by JS based on role -->
        </nav>

        <div class="mt-auto pt-4 border-top border-secondary border-opacity-10">
            <div class="d-flex align-items-center gap-2">
                <div id="user-avatar"
                    class="bg-primary rounded-circle d-flex align-items-center justify-content-center text-white fw-bold"
                    style="width: 32px; height: 32px;">U</div>
                <div class="d-grid">
                    <span id="user-name-display" class="text-white text-sm fw-bold">User</span>

                </div>
            </div>
        </div>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="dashboard-main">
        <header class="dashboard-header">
            <h4 class="text-white fw-bold mb-0">Analytics Overview</h4>
            <div class="d-flex align-items-center gap-4">
                <button class="btn btn-outline-light btn-sm rounded-pill"><i class="fas fa-download me-2"></i>Export
                    Report</button>
            </div>
        </header>

        <div class="p-4">
            <!-- KPIs -->
            <div class="row g-4 mb-4">
                <div class="col-md-3">
                    <div class="card-enterprise p-4">
                        <p class="text-muted small fw-bold mb-1" id="kpi-spend-label">TOTAL SPEND</p>
                        <h3 class="text-white fw-bold" id="kpi-spend">Loading...</h3>
                        <span class="text-success small" id="kpi-spend-sub"><i class="fas fa-arrow-up"></i> from your
                            shipments</span>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card-enterprise p-4">
                        <p class="text-muted small fw-bold mb-1">TOTAL SHIPMENTS</p>
                        <h3 class="text-white fw-bold" id="kpi-total">--</h3>
                        <span class="text-info small">All time</span>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card-enterprise p-4">
                        <p class="text-muted small fw-bold mb-1">DELIVERED</p>
                        <h3 class="text-white fw-bold" id="kpi-delivered">--</h3>
                        <span class="text-success small"><i class="fas fa-check-circle"></i> Completed</span>
                    </div>
                </div>
            </div>

            <!-- Charts Placeholder -->
            <div class="row g-4">
                <div class="col-lg-8">
                    <div class="card-enterprise p-4 h-100">
                        <h5 class="text-white fw-bold mb-4">Shipment Volume</h5>
                        <div class="d-flex align-items-end justify-content-between h-50 gap-2 px-2">
                            <!-- Fake Bars -->
                            <div class="w-100 bg-primary bg-opacity-25 rounded-top" style="height: 40%"></div>
                            <div class="w-100 bg-primary bg-opacity-50 rounded-top" style="height: 60%"></div>
                            <div class="w-100 bg-primary bg-opacity-75 rounded-top" style="height: 30%"></div>
                            <div class="w-100 bg-primary rounded-top" style="height: 85%"></div>
                            <div class="w-100 bg-primary bg-opacity-50 rounded-top" style="height: 50%"></div>
                            <div class="w-100 bg-primary bg-opacity-25 rounded-top" style="height: 90%"></div>
                        </div>
                        <div class="d-flex justify-content-between text-muted small mt-2">
                            <span>Jan</span><span>Feb</span><span>Mar</span><span>Apr</span><span>May</span><span>Jun</span>
                        </div>
                    </div>
                </div>
                <div class="col-lg-4">
                    <div class="card-enterprise p-4 h-100">
                        <h5 class="text-white fw-bold mb-4">Mode Split</h5>
                        <div class="d-flex flex-column gap-3">
                            <div>
                                <div class="d-flex justify-content-between text-white small mb-1">
                                    <span>Ocean Freight</span>
                                    <span>65%</span>
                                </div>
                                <div class="progress" style="height: 6px;">
                                    <div class="progress-bar bg-primary" style="width: 65%"></div>
                                </div>
                            </div>
                            <div>
                                <div class="d-flex justify-content-between text-white small mb-1">
                                    <span>Air Freight</span>
                                    <span>25%</span>
                                </div>
                                <div class="progress" style="height: 6px;">
                                    <div class="progress-bar bg-info" style="width: 25%"></div>
                                </div>
                            </div>
                            <div>
                                <div class="d-flex justify-content-between text-white small mb-1">
                                    <span>Inland</span>
                                    <span>10%</span>
                                </div>
                                <div class="progress" style="height: 6px;">
                                    <div class="progress-bar bg-warning" style="width: 10%"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <script src="config.js"></script>
    <script src="auth-guard.js"></script>
    <script>
        const API_URL = window.API_BASE_URL || '';

        document.addEventListener('DOMContentLoaded', async () => {
            try {
                const res = await fetch(`${API_URL}/api/auth/me`, { credentials: 'include' });
                const data = await res.json();
                if (!data.success) { window.location.href = 'auth.html'; return; }

                const name = data.user.name || 'User';
                document.getElementById('user-name-display').innerText = name;
                document.getElementById('user-avatar').innerText = name.charAt(0).toUpperCase();

                const role = data.user.role;

                // 1. Inject Dynamic Navigation
                const nav = document.getElementById('dynamic-nav');
                if (role === 'company') {
                    nav.innerHTML = `
                        <a href="company-dashboard.html" class="nav-item-dash"><i class="fas fa-th-large w-5"></i> Dashboard</a>
                        <a href="vehicles.html" class="nav-item-dash"><i class="fas fa-truck w-5"></i> Fleet Management</a>
                        <a href="earnings.html" class="nav-item-dash"><i class="fas fa-file-invoice-dollar w-5"></i> Earnings</a>
                        <hr class="border-secondary opacity-25 my-3">

                        <a href="profile.html" class="nav-item-dash"><i class="fas fa-cog w-5"></i> Settings</a>
                    `;
                } else {
                    nav.innerHTML = `
                        <a href="shipments.html" class="nav-item-dash"><i class="fas fa-th-large w-5"></i> Dashboard</a>
                        <a href="shipments.html" class="nav-item-dash"><i class="fas fa-box w-5"></i> Shipments</a>
                        <a href="wizard.html" class="nav-item-dash"><i class="fas fa-plus-circle w-5"></i> New Booking</a>
                        <a href="track.html" class="nav-item-dash"><i class="fas fa-map-marked-alt w-5"></i> Live Tracking</a>
                        <hr class="border-secondary opacity-25 my-3">
                        <a href="finance.html" class="nav-item-dash"><i class="fas fa-file-invoice w-5"></i> Billing</a>

                        <a href="profile.html" class="nav-item-dash"><i class="fas fa-cog w-5"></i> Settings</a>
                    `;
                }

                // 2. Fetch appropriate stats
                if (role === 'company') {
                    document.getElementById('kpi-spend-label').innerText = 'TOTAL REVENUE';
                    document.getElementById('kpi-spend-sub').innerHTML = '<i class="fas fa-arrow-up"></i> platform lifetime earnings';

                    const shipRes = await fetch(`${API_URL}/api/company/active`, { credentials: 'include' });
                    const statsRes = await fetch(`${API_URL}/api/company/stats`, { credentials: 'include' });

                    const shipData = await shipRes.json();
                    const statsData = await statsRes.json();

                    if (statsData.success) {
                        document.getElementById('kpi-total').innerText = statsData.stats.activeDeliveries || 0; // Quick swap for active
                        document.getElementById('kpi-delivered').innerText = `${statsData.stats.onTimeRate || 0}% Rate`;
                        document.getElementById('kpi-spend').innerText = `₹${(statsData.stats.netEarnings || 0).toLocaleString('en-IN')}`;
                    }
                } else {
                    // Load real shipment stats from the API (Customer)
                    const shipRes = await fetch(`${API_URL}/api/shipment/list`, { credentials: 'include' });
                    const shipData = await shipRes.json();

                    if (shipData.success) {
                        const shipments = shipData.shipments || [];
                        const total = shipments.length;
                        const delivered = shipments.filter(s => s.status === 'Delivered').length;
                        const totalSpend = shipments.reduce((sum, s) => sum + (parseFloat(s.estimated_cost) || 0), 0);

                        document.getElementById('kpi-total').innerText = total;
                        document.getElementById('kpi-delivered').innerText = delivered;
                        document.getElementById('kpi-spend').innerText = total > 0 ? `₹${totalSpend.toLocaleString('en-IN')}` : '₹0';
                    }
                }
            } catch (err) {
                console.error(err);
                window.location.href = 'auth.html';
            }
        });

        async function handleLogout() {
            await fetch(`${API_URL}/api/auth/logout`, { method: 'POST', credentials: 'include' });
            window.location.href = 'auth.html';
        }
    </script>
</body>

</html>
