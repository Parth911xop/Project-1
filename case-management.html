<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Case Management | Smart Shipping</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <script src="nav.js"></script>
</head>

<body class="home-page">

    <!-- Header -->
    <header class="hero-section d-flex align-items-center position-relative" style="min-height: 60vh;">
        <div class="container position-relative z-2">
            <h1 class="display-3 fw-bold mb-4">Case Management</h1>
            <p class="lead text-white-50 mb-5" style="max-width: 600px;">Create and track support cases for your
                shipments.</p>

            <div class="d-flex gap-3">
                <button class="btn btn-primary btn-lg rounded-pill px-4"><i class="fas fa-plus me-2"></i> Create New
                    Case</button>
                <button class="btn btn-outline-light btn-lg rounded-pill px-4">View Closed Cases</button>
            </div>

            <div class="mt-5">
                <div class="card-enterprise p-4">
                    <h5>Open Cases</h5>
                    <p class="text-muted text-center py-5">No open cases found.</p>
                </div>
            </div>

        </div>
    </header>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>

</html>
